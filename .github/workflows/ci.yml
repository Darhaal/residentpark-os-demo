name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify formal migration chain
        run: npm run verify:migrations

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
        env:
          # Placeholder public env so the build can run without a live project.
          # The app reads Supabase at request time, not build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  db:
    name: DB authorization · Security posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: supabase init --force

      - name: Start local Supabase
        run: supabase start

      - name: Write test credentials from the local stack
        run: |
          supabase status -o env > supabase-status.env
          set -a; . ./supabase-status.env; set +a
          {
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "TEST_DATABASE_URL=$DB_URL"
          } > .env.test.local
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Replay formal migrations into the local database
        run: |
          npm run verify:migrations
          supabase db reset
          node scripts/apply-sql.mjs src/test/db/service-role-grants.sql

      - name: Reload PostgREST so it caches the freshly loaded schema
        run: |
          docker restart "$(docker ps --filter name=supabase_rest --format '{{.ID}}')"
          sleep 5

      - name: Database authorization tests (RLS + SECURITY DEFINER matrix)
        run: npm run test:db
        env:
          DB_TEST_SCHEMA_PRELOADED: '1'

      - name: Security posture verification (20-check read-only audit)
        run: npm run verify:security

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: supabase init --force

      - name: Start local Supabase
        run: supabase start

      - name: Write app env from the local stack
        run: |
          supabase status -o env > supabase-status.env
          set -a; . ./supabase-status.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } > .env.local

      - name: Replay formal migrations into the local database
        run: |
          npm run verify:migrations
          supabase db reset
          node scripts/apply-sql.mjs src/test/db/service-role-grants.sql

      - name: Reload PostgREST so it caches the freshly loaded schema
        run: |
          docker restart "$(docker ps --filter name=supabase_rest --format '{{.ID}}')"
          sleep 5

      - name: Seed demo data
        run: npm run seed:demo

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  e2e-invite-confirm:
    name: E2E · Invitation (email confirmation)
    runs-on: ubuntu-latest
    # Confirmation-ENABLED invitation accept flow: it follows the real email-click PKCE
    # callback through the local Mailpit capture service (legacy Inbucket is also supported).
    # Runs as a blocking gate alongside the default E2E job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: supabase init --force

      - name: Enable email confirmations and allow the app callback redirect
        run: |
          cfg=supabase/config.toml
          sed -i 's#^site_url = .*#site_url = "http://localhost:3000"#' "$cfg"
          sed -i 's#^additional_redirect_urls = .*#additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/callback", "http://127.0.0.1:3000"]#' "$cfg"
          # Scope the replacement to [auth.email]. A global replacement also enables
          # the unrelated [auth.sms] confirmation setting in current CLI templates.
          sed -i '/^\[auth\.email\]/,/^\[/{s@^[[:space:]]*#\?[[:space:]]*enable_confirmations[[:space:]]*=.*@enable_confirmations = true@}' "$cfg"
          echo "----- patched auth settings -----"
          sed -n '/^\[auth\.email\]/,/^\[/p' "$cfg"

      - name: Start local Supabase
        run: supabase start

      - name: Write app env from the local stack
        run: |
          supabase status -o env > supabase-status.env
          set -a; . ./supabase-status.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } > .env.local

      - name: Replay formal migrations into the local database
        run: |
          npm run verify:migrations
          supabase db reset
          node scripts/apply-sql.mjs src/test/db/service-role-grants.sql

      - name: Reload PostgREST so it caches the freshly loaded schema
        run: |
          docker restart "$(docker ps --filter name=supabase_rest --format '{{.ID}}')"
          sleep 5

      - name: Seed demo data
        run: npm run seed:demo

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run confirmation-enabled invitation E2E
        run: npx playwright test e2e/invitation-accept-confirm.spec.ts
        env:
          E2E_EMAIL_CONFIRM: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-invite-confirm
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop
